[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: fast post-run sanity
    metadata: engine run bookkeeping
    completeness: coverage of eligible series and horizon
    values: numerical integrity of forecast outputs
    model: model-property checks (additivity, seasonality, holidays)
    accuracy: back-test KPI verification
    aggregation: hierarchy / view consistency
    regression: idempotency and configuration behaviour
